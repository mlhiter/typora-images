<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mspace product workflow loop</title>
  <desc id="desc">mspace starts from an issue, runs an agent session, reviews code and evidence, deploys to a Kubernetes preview namespace, and hands off a branch or pull request.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111827" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f5f9e"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="36" fill="#f7f7f7"/>
  <text x="80" y="96" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="700">mspace 工作闭环</text>
  <text x="80" y="138" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20">把 Agent 的一次执行变成团队可以 review、验证、交接和清理的 Issue 生命周期。</text>

  <g filter="url(#shadow)">
    <rect x="88" y="234" width="214" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="124" y="290" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Issue</text>
    <text x="124" y="330" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">问题、讨论、任务</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="234" width="214" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="434" y="290" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Agent Session</text>
    <text x="434" y="330" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">一次可追踪执行</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="708" y="234" width="214" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="744" y="290" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Code Diff</text>
    <text x="744" y="330" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">分支、提交、变更</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1018" y="234" width="294" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="1054" y="290" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Kubernetes Preview</text>
    <text x="1054" y="330" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">Issue Namespace、预览地址</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="708" y="504" width="214" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="744" y="560" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">Evidence</text>
    <text x="744" y="600" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">命令、测试、资源状态</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="398" y="504" width="214" height="152" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="434" y="560" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">PR Handoff</text>
    <text x="434" y="600" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">分支、PR、后续动作</text>
  </g>

  <path d="M 314 310 L 380 310" stroke="#2f5f9e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 624 310 L 690 310" stroke="#2f5f9e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 934 310 L 1000 310" stroke="#2f5f9e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1165 402 C 1165 466 1035 526 942 558" stroke="#2f5f9e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 690 580 L 624 580" stroke="#2f5f9e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 398 580 C 214 574 152 496 170 404" stroke="#2f5f9e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="80" y="680" width="1240" height="1" fill="#dedede"/>
  <text x="80" y="716" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18">核心判断：mspace 不是让 Agent 更会写代码，而是让 Agent 的产出更容易被团队验证和继承。</text>
</svg>
