<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">mspace roadmap</title>
  <desc id="desc">mspace roadmap from local agent loop to team runtime to Kubernetes hosted runtime.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111827" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f5f9e"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="36" fill="#f7f7f7"/>
  <text x="80" y="96" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="40" font-weight="700">mspace 路线图</text>
  <text x="80" y="138" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20">先把 Issue 到证据的本地闭环跑顺，再扩展团队 Runtime，最后再把 Agent Runtime 放进 Kubernetes。</text>

  <path d="M 160 380 L 1240 380" stroke="#2f5f9e" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="260" cy="380" r="18" fill="#2f5f9e"/>
  <circle cx="700" cy="380" r="18" fill="#2f5f9e"/>
  <circle cx="1140" cy="380" r="18" fill="#2f5f9e"/>

  <g filter="url(#shadow)">
    <rect x="112" y="196" width="296" height="142" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="148" y="252" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">阶段 1</text>
    <text x="148" y="292" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17">可用的本地 Agent Loop</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="552" y="422" width="296" height="142" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="588" y="478" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">阶段 2</text>
    <text x="588" y="518" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17">Team Worker Runtime</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="992" y="196" width="296" height="142" rx="18" fill="#ffffff" stroke="#dedede"/>
    <text x="1028" y="252" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="700">阶段 3</text>
    <text x="1028" y="292" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17">Kubernetes-hosted Runtime</text>
  </g>

  <text x="112" y="620" fill="#1f1f1f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700">优先级规则</text>
  <text x="112" y="656" fill="#737373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18">所有新功能都先问一个问题：它是否让 Issue -> Agent Session -> Evidence -> Preview -> PR 的闭环更清楚。</text>
</svg>
